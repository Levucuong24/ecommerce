name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        run: |
          cd back_end
          npm ci || npm install

      - name: Run Backend Tests
        run: |
          cd back_end
          npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/ecommerce_test
          JWT_SECRET: test_jwt_secret_value_1234567890
          PORT: 5000

  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        run: |
          cd front-end
          npm ci || npm install

      - name: Run Linting
        run: |
          cd front-end
          npm run lint
